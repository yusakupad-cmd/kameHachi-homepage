name            = "kame-social-feed"
main            = "social-feed.js"
compatibility_date = "2024-09-23"

# ── D1 データベース ────────────────────────────────────────────────
# 作成コマンド: wrangler d1 create kame-social
# → 表示される database_id を下記に貼り付ける
[[d1_databases]]
binding       = "DB"
database_name = "kame-social"
database_id   = "532d44be-2c1e-4112-bca8-7ec0f5f46d13"

# ── 環境変数 ───────────────────────────────────────────────────────
[vars]
# YouTube チャンネルID: https://www.youtube.com/channel/XXXX の XXXX 部分
YOUTUBE_CHANNEL_ID = "UCg3LDKFWwCQMZlM_zyXgSUA"

# Notion: wrangler secret put NOTION_API_KEY で安全に設定する
# NOTION_API_KEY は secret のため wrangler.toml に書かない

# Instagram: wrangler secret put INSTAGRAM_ACCESS_TOKEN で設定する
# 取得手順:
#   1. https://developers.facebook.com でアプリを作成
#   2. 「Instagram」製品を追加
#   3. @ogawakizukulab アカウントを接続
#   4. アクセストークンを生成（長期トークン: 60日間有効）
#   5. wrangler secret put INSTAGRAM_ACCESS_TOKEN
# INSTAGRAM_ACCESS_TOKEN は secret のため wrangler.toml に書かない

# Notion お知らせDB のデータベースID (URLの32桁の英数字)
NOTION_NEWS_DB_ID = "f3ddd492f8b646359663bdff8458b915"

# Notion ブログDB のデータベースID
NOTION_BLOG_DB_ID = "d8d080e5b329488683a9bc4355b5ea27"

# Notion公開サイトのサブドメイン（notion.so/my-settingsで確認）
NOTION_SITE_SUBDOMAIN = "zest-meadowlark-170"

# ── Cron スケジュール ─────────────────────────────────────────────
[triggers]
crons = ["0 * * * *"]  # 毎時0分に YouTube + Notion を同期

# ── デプロイ手順 ──────────────────────────────────────────────────
# 1. wrangler d1 create kame-social
# 2. 上記の database_id を更新
# 3. wrangler d1 execute kame-social --file=schema.sql
# 4. wrangler secret put NOTION_API_KEY   ← Notion インテグレーションのシークレット
# 5. wrangler.toml の各IDを実際の値に更新
# 6. wrangler deploy
# 7. index.html の WORKER_BASE を https://kame-social-feed.<subdomain>.workers.dev に更新

# ── Notion DB プロパティ定義 ──────────────────────────────────────
# お知らせDB:
#   Title    (title)    ← ページタイトル
#   Date     (date)     ← 公開日
#   Category (select)   ← "お知らせ" / "イベント"
#   Published(checkbox) ← チェック = 公開
#
# ブログDB:
#   Title    (title)    ← ページタイトル
#   Date     (date)     ← 投稿日
#   Published(checkbox) ← チェック = 公開
#   カバー画像はページカバー (page.cover) を使用
